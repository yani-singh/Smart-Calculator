<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header class="header">
            <h1>Calculator</h1>
        </header>

        <section class="display">
            <p class="display-text">YOUR RESULT</p>
            <input type="text" id="screen" readonly placeholder="0">
        </section>

        <section class="buttons">

            <button class="clear-btn" onclick="resetCalculator()">AC</button>
            <button class="special-btn" onclick="enterSymbol('(')">(</button>
            <button class="special-btn" onclick="enterSymbol(')')">)</button>
            <button class="special-btn" onclick="removeLast()">⌫</button>

            <button onclick="enterSymbol('7')">7</button>
            <button onclick="enterSymbol('8')">8</button>
            <button onclick="enterSymbol('9')">9</button>
            <button class="operator-btn" onclick="enterSymbol('/')">÷</button>

            <button onclick="enterSymbol('4')">4</button>
            <button onclick="enterSymbol('5')">5</button>
            <button onclick="enterSymbol('6')">6</button>
            <button class="operator-btn" onclick="enterSymbol('*')">×</button>

            <button onclick="enterSymbol('1')">1</button>
            <button onclick="enterSymbol('2')">2</button>
            <button onclick="enterSymbol('3')">3</button>
            <button class="operator-btn" onclick="enterSymbol('-')">−</button>

            <button class="zero-btn" onclick="enterSymbol('0')">0</button>
            <button onclick="enterSymbol('.')">.</button>
            <button class="operator-btn" onclick="enterSymbol('+')">+</button>

            <button class="calculate-btn" onclick="showAnswer()">Calculate</button>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
